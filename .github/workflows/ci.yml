name: CI

on:
  pull_request:
  push:
    branches: [main, "uat/current"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e ".[nlp]"
      - run: python -m pytest -q
      - run: python scripts/validate_official_factor_spec.py factors/*/spec.json
